name: AlkaMinesPack
version: '${version}'
main: com.alka.mines.AlkaMines
api-version: '1.21.8'
author: MestreDEV
description: Mina pessoal evolutiva (blocos virtuais anti-lag) com picareta, encantamentos, prestigio, skins e aluguel.
depend: [AlkaCore, AlkaEconomy]
softdepend: [ProtocolLib]

commands:
  mina:
    description: Teleporta para a sua mina pessoal evolutiva.
    aliases: [minas]
  minapessoal:
    description: Teleporta para a sua mina pessoal evolutiva.
    aliases: [minapessoal, minap]
  picareta:
    description: Entrega a picareta evolutiva.
  encantamentos:
    description: Abre o menu de encantamentos da picareta.
  prestigio:
    description: Abre o menu de prestigio da picareta.
  alugar:
    description: Abre o menu de aluguel da picareta.
  alkaminesadmin:
    description: Comandos administrativos da mina pessoal (encantamento, resetmine).
    aliases: [alkaminesadmin, madmin]

permissions:
  alkamines.minapessoal:
    description: Permite usar /mina e /minapessoal (mina pessoal evolutiva).
    default: op
  alkamines.picareta:
    description: Permite usar /picareta.
    default: op
  alkamines.encantamentos:
    description: Permite usar /encantamentos.
    default: op
  alkamines.prestigio:
    description: Permite usar /prestigio.
    default: op
  alkamines.alugar:
    description: Permite usar /alugar.
    default: op
  alkamines.admin:
    description: Permite usar /alkaminesadmin.
    default: op
  alkamines.admin.resetmine:
    description: Permite resetar a mina de qualquer jogador.
    default: op
