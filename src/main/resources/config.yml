# Configuracao do AlkaMinesPack (mina pessoal evolutiva).

# Log de debug no console ([AlkaMines-DEBUG]).
debug: false

# =====================================================================
# Encantamentos customizados da picareta (EDITAVEIS AQUI).
# base-chance: % no nivel 1 | chance-per-level: % adicional por nivel.
# unlock-level: nivel da picareta pra desbloquear | base-cost: custo em coins.
# =====================================================================
enchantments:
  DRAGON:
    display-name: "Dragão"
    description: "Invoca um dragão que quebra blocos"
    max-level: 5
    base-chance: 20.0
    chance-per-level: 10.0
    cooldown-seconds: 2
    base-cost: 1000
    unlock-level: 1
  EXPLOSION:
    display-name: "Explosão"
    description: "Quebra em área 3x3"
    max-level: 10
    base-chance: 5.0
    chance-per-level: 2.0
    cooldown-seconds: 5
    base-cost: 500
    unlock-level: 10
  KEYFINDER:
    display-name: "Keyfinder"
    description: "Chance de encontrar keys"
    max-level: 5
    base-chance: 1.0
    chance-per-level: 1.0
    cooldown-seconds: 0
    base-cost: 2000
    unlock-level: 25
  FORTUNE_BOOST:
    display-name: "Fortuna+"
    description: "Aumenta drops em 50% por nível"
    max-level: 5
    base-chance: 0.0
    chance-per-level: 0.0
    cooldown-seconds: 0
    base-cost: 1500
    unlock-level: 15
  SPEED_MINING:
    display-name: "Velocidade"
    description: "Haste permanente ao minerar"
    max-level: 3
    base-chance: 0.0
    chance-per-level: 0.0
    cooldown-seconds: 0
    base-cost: 800
    unlock-level: 5
  MEMORIZE:
    display-name: "Memorizando"
    description: "Bônus por padrão de blocos"
    max-level: 1
    base-chance: 0.0
    chance-per-level: 0.0
    cooldown-seconds: 0
    base-cost: 5000
    unlock-level: 100

# Picareta evolutiva: nivel = maior nivel com base*level^exponent <= blocos efetivos
# (blocos desde o ultimo prestigio).
pickaxe-evolution:
  base: 5.0
  exponent: 1.0
  max-level: 100

# =====================================================================
# Mina pessoal evolutiva (ANTI-LAG - blocos virtuais client-side).
# O mundo real da mina so tem BEDROCK no chao e AR no resto; os blocos visiveis
# sao virtuais. mine-world e o nome do mundo onde as minas pessoais ficam.
# =====================================================================
personal-mine:
  max-size: 31
  start-size: 5
  depth: 50
  expand-every-levels: 20
  # cada prestigio conta como +X niveis pra expandir a mina (permite chegar aos 31x31
  # mesmo com o nivel resetando a cada prestigio). 100 = +5 de tamanho por prestigio.
  prestige-level-bonus: 100
  surface-y: 100
  grid-spacing: 1000
  mine-world: world
  respawn-delay-ticks: 40
  compositions:
    '1':
      STONE: 0.9
      COAL_ORE: 0.1
    '21':
      STONE: 0.7
      COAL_ORE: 0.2
      IRON_ORE: 0.1
    '41':
      STONE: 0.5
      IRON_ORE: 0.2
      GOLD_ORE: 0.2
      REDSTONE_ORE: 0.1
    '61':
      STONE: 0.3
      IRON_ORE: 0.2
      GOLD_ORE: 0.2
      DIAMOND_ORE: 0.2
      EMERALD_ORE: 0.1
    '81':
      STONE: 0.1
      GOLD_ORE: 0.3
      DIAMOND_ORE: 0.3
      EMERALD_ORE: 0.2
      ANCIENT_DEBRIS: 0.1
  sell-values:
    STONE: 1.0
    COAL_ORE: 5.0
    IRON_ORE: 10.0
    GOLD_ORE: 25.0
    REDSTONE_ORE: 15.0
    DIAMOND_ORE: 50.0
    EMERALD_ORE: 75.0
    ANCIENT_DEBRIS: 200.0

# =====================================================================
# Habilidade do DRAGAO (encantamento DRAGON) - entidade fake client-side que
# sobrevoa a mina pessoal e quebra blocos VIRTUAIS (venda automatica + picareta upa).
# =====================================================================
abilities:
  dragon_breath:
    enabled: true
    cooldown-seconds: 30
    trajectory:
      radius: 20.0
      height: 15.0
      duration-ticks: 200
    breath:
      range: 35
      check-interval-ticks: 2

# =====================================================================
# Skins da picareta - permite usar ITENS CUSTOM (ItemsAdder) no lugar do material
# padrao. Se `custom-item` nao estiver preenchido (ou o ItemsAdder nao estiver
# instalado), usa o material padrao da skin. O ID e o namespace do ItemsAdder,
# ex: "myitems:crystal".
# =====================================================================
skins:
  DEFAULT:
    custom-item: ""
  NETHERITE:
    custom-item: ""
  DRAGON:
    custom-item: ""
  CRYSTAL:
    custom-item: ""
  EVENTO:
    custom-item: ""

# =====================================================================
# Placeholders (PlaceholderAPI) - %alkamines_*% (nivel, blocos, prestigio, etc.)
# leem a picareta na MAO do jogador. Sem config extra.
# =====================================================================
